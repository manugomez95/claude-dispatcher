name: Dispatch Linear Tasks

on:
  # Configure schedule in repository variable LINEAR_CRON
  # Default: Every hour from 11 PM to 6 AM Madrid time
  schedule:
    - cron: '0 22,23,0,1,2,3,4,5 * * *'

  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Skip if LINEAR_DISPATCH_ENABLED is explicitly set to false
    if: vars.LINEAR_DISPATCH_ENABLED != 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dispatch Linear task
        env:
          TASK_SOURCE: linear
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CLAUDE_USER_ID: ${{ secrets.CLAUDE_USER_ID }}
          LINEAR_PROJECT_IDS: ${{ vars.LINEAR_PROJECT_IDS }}
          LINEAR_TEAM_KEYS: ${{ vars.LINEAR_TEAM_KEYS }}
        run: npm run dispatch
