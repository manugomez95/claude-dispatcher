name: Dispatch GitHub Issues

on:
  # Configure your preferred schedule here
  # Default: Every 2 hours during work hours (9 AM - 6 PM UTC)
  schedule:
    - cron: '0 9,11,13,15,17 * * *'

  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Only run if GH_DISPATCH_ENABLED is set to true
    if: vars.GH_DISPATCH_ENABLED == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dispatch GitHub task
        env:
          TASK_SOURCE: github
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_OWNER: ${{ vars.GH_OWNER }}
          GH_REPO: ${{ vars.GH_REPO }}
          GH_READY_LABEL: ${{ vars.GH_READY_LABEL }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CLAUDE_USER_ID: ${{ secrets.CLAUDE_USER_ID }}
        run: npm run dispatch
